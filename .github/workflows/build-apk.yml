name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
 
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
 
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
 
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true
 
      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli
 
      - name: Pre-configure Bubblewrap (skip interactive prompts)
        run: |
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json << EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF
          cat ~/.bubblewrap/config.json
 
      - name: Restore signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > android.keystore
 
      - name: Build APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
         echo "n" | bubblewrap build --skipPwaValidation
 
      - name: Find APK
        run: find . -name "*.apk" -type f -print
 
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dealradar-apk
          path: |
            app-release-signed.apk
            app-release-unsigned-aligned.apk
          if-no-files-found: warn
